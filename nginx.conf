##############################################################################
# Festiva - Nginx configuration
# Domain: app.festiva.no
#
# Architecture:
#   - Angular SSR (Node/PM2)  → localhost:4000
#   - NestJS API              → localhost:3001  (adjust if different)
#   - Go API (user)           → localhost:8002
##############################################################################

server {
    listen 80;
    server_name app.festiva.no;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.festiva.no;

    # --- SSL (adjust paths to your certificates) ---
    ssl_certificate     /etc/letsencrypt/live/app.festiva.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.festiva.no/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- Security headers ---
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "SAMEORIGIN"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Sitemap: proxy to the NestJS backend ---
    # IMPORTANT: NestJS sets global prefix "api", so check whether the
    # sitemap controller bypasses it. Adjust the upstream path accordingly:
    #   - If sitemap is at /sitemap.xml on NestJS → proxy_pass http://localhost:3001/sitemap.xml
    #   - If it ended up at /api/sitemap.xml      → proxy_pass http://localhost:3001/api/sitemap.xml
    location = /sitemap.xml {
        proxy_pass         http://localhost:3001/sitemap.xml;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # Cache the sitemap for 1 hour
        proxy_cache_valid  200 1h;
        add_header         Cache-Control "public, max-age=3600";
        add_header         Content-Type  "application/xml; charset=utf-8";
    }

    # --- robots.txt: served from Angular SSR static assets ---
    location = /robots.txt {
        proxy_pass http://localhost:4000/robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }

    # --- Angular SSR app (all other routes) ---
    location / {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
